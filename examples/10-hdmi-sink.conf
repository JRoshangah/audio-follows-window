# Exposes an HDMI output as a second sink alongside the built-in analog one.
#
# Needed on machines where every ALSA card profile is single-sink, so
# PulseAudio/PipeWire will only ever show one output at a time. Check with:
#
#   pactl list cards | grep -A40 "Profiles:"
#
# If every line says "sinks: 1", you need this file.
#
# Install to: ~/.config/pipewire/pipewire.conf.d/10-hdmi-sink.conf
# Then:       systemctl --user restart pipewire pipewire-pulse wireplumber
#
# Change api.alsa.path to match your hardware. Find it with `aplay -l`:
# a line like "card 0: PCH, device 3: HDMI 0 [YOUR_MONITOR_MODEL]" means
# hw:0,3 — the model name in brackets confirms the monitor is detected.

context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "hdmi_monitor"
      node.description = "Monitor Speakers"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hw:0,3"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
    }
  }
]
