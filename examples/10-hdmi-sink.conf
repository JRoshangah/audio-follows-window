# Exposes an HDMI output as a second sink alongside the built-in analog one.
#
# Needed on machines where every ALSA card profile is single-sink, so
# PulseAudio/PipeWire will only ever show one output at a time. Check with:
#
#   pactl list cards | grep -A40 "Profiles:"
#
# If every line says "sinks: 1", you need this file.
#
# Install to: ~/.config/pipewire/pipewire.conf.d/10-hdmi-sink.conf
# Then:       systemctl --user restart pipewire pipewire-pulse wireplumber
#
# Change api.alsa.path to match your hardware. Find it with `aplay -l`:
# a line like "card 0: PCH, device 3: HDMI 0 [YOUR_MONITOR_MODEL]" means
# hw:0,3 — the model name in brackets confirms the monitor is detected.
#
# AFTER INSTALLING THIS: if the sink appears but produces no sound, the
# IEC958 switch for that pin is almost certainly muted. See the README
# section "Sink exists, state RUNNING, but no sound". Quick check:
#
#   amixer -c 0 scontents | grep -B4 -i "playback \[off\]"
#
# Do not change the hardware profile in Sound Preferences after this is
# installed — ACP will fight this node for the device and silently break it
# until PipeWire is restarted.

context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.sink
      node.name        = "hdmi_monitor"
      node.description = "Monitor Speakers"
      media.class      = "Audio/Sink"
      api.alsa.path    = "hw:0,3"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]

      # Keep the HDMI link awake. Some HDMI PCMs fail to resume from suspend
      # silently — the node reports RUNNING with no audio reaching the display.
      # Costs negligible power.
      session.suspend-timeout-seconds = 0
      node.pause-on-idle              = false
    }
  }
]
